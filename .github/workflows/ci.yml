# Integracion continua. Duenia: Persona 5 (administradora de GitHub).
# Corre las pruebas en cada push y en cada Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Correr las pruebas
        env:
          SDL_VIDEODRIVER: dummy
        run: pytest
